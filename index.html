<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Tracker - Messages & Stories</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📱 WhatsApp Tracker</h1>
            <p>View messages and stories by phone number</p>
        </header>

        <!-- Search/Input Section -->
        <section class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="phoneInput" 
                    class="phone-input" 
                    placeholder="Enter phone number (e.g., +1-555-123-4567)"
                    autocomplete="off"
                >
                <button id="searchBtn" class="search-button">🔍 Search</button>
            </div>
            <div class="contact-shortcuts">
                <button class="quick-contact" onclick="searchByNumber('+1-555-0001')">Alice (+1-555-0001)</button>
                <button class="quick-contact" onclick="searchByNumber('+1-555-0002')">Bob (+1-555-0002)</button>
                <button class="quick-contact" onclick="searchByNumber('+1-555-0003')">Charlie (+1-555-0003)</button>
            </div>
        </section>

        <!-- Contact Info Display -->
        <section id="contactInfo" class="contact-info hidden">
            <div class="contact-header">
                <div class="contact-avatar" id="contactAvatar"></div>
                <div class="contact-details">
                    <h2 id="contactName">Contact Name</h2>
                    <p id="contactPhone">Phone: +1-555-0001</p>
                    <p id="contactStatus">Status: Online</p>
                </div>
            </div>
        </section>

        <!-- Navigation Tabs -->
        <nav class="tabs" id="tabs" style="display: none;">
            <button class="tab-button active" data-tab="messages">💬 Messages</button>
            <button class="tab-button" data-tab="stories">📖 Stories</button>
            <button class="tab-button" data-tab="info">ℹ️ Info</button>
        </nav>

        <!-- Messages Section -->
        <section id="messages" class="tab-content active">
            <h2>Messages</h2>
            <div class="messages-container">
                <!-- Messages will be populated here -->
            </div>
        </section>

        <!-- Stories Section -->
        <section id="stories" class="tab-content">
            <h2>Stories</h2>
            <div class="stories-container">
                <!-- Stories will be populated here -->
            </div>
        </section>

        <!-- Info Section -->
        <section id="info" class="tab-content">
            <h2>Contact Information</h2>
            <div class="info-container">
                <!-- Info will be populated here -->
            </div>
        </section>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <p>👆 Enter a phone number above to view messages and stories</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
